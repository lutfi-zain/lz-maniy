name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static production bundle
        run: bun run build
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL || 'https://reedrich-mcp.lutfidmz.workers.dev' }}
          PUBLIC_API_TOKEN: ${{ secrets.PUBLIC_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd3cb514242b0dac821852e4232a0be4d' }}
          command: pages deploy build --project-name=maniyy2 --branch=main
