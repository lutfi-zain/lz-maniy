name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_URL: https://reedrich-mcp.lutfidmz.workers.dev
      PUBLIC_AGENT_URL: https://maniyy-agent.lutfidmz.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Workspace
        run: bun run --cwd packages/shared check && bun run --cwd apps/web check

      - name: Run Web tests
        run: bun run --cwd apps/web test:unit

      - name: Run Agent tests
        run: bun run --cwd apps/agent test
