# Promptfoo Evaluation Test Cases for Maniy Agent
# Extracted and structured from real-user financial interaction patterns

- description: "[TC-01] Saldo kas siap pakai"
  vars:
    prompt: "Saldo kas siap pakai saya ada berapa saat ini?"
  assert:
    - type: contains
      value: "kas siap pakai"
    - type: not-contains
      value: "$"
    - type: javascript
      value: "output.toLowerCase().includes('kas siap pakai') && (output.includes('get_snapshot') || output.includes('financial_summary'))"
    - type: llm-rubric
      value: "Response must explain the spendable cash balance clearly in Indonesian Rupiah using tool data without hallucinating unverified funds."

- description: "[TC-02] Planning networth projection"
  vars:
    prompt: "networth bulan depan berapa kalau semua planned terealisasi?"
  assert:
    - type: contains
      value: "Oktober"
    - type: not-contains
      value: "$"
    - type: javascript
      value: "output.includes('5.3') || output.includes('5.303') || output.includes('5 303')"

- description: "[TC-03] Multi-currency USDT balance"
  vars:
    prompt: "Berapa saldo aset saya yang dalam bentuk USDT atau valas asing?"
  assert:
    - type: contains
      value: "USDT"
    - type: contains
      value: "115"
    - type: not-contains
      value: "Rp 115"

- description: "[TC-04] Category breakdown expense"
  vars:
    prompt: "Pengeluaran terbesar saya bulan ini dialokasikan ke kategori apa?"
  assert:
    - type: contains
      value: "kategori"
    - type: not-contains
      value: "$"
    - type: llm-rubric
      value: "Agent identifies highest expense category from financial data."

- description: "[TC-05] UI navigation planning"
  vars:
    prompt: "Tolong buka halaman planning"
  assert:
    - type: contains
      value: "/planning"
    - type: javascript
      value: "output.includes('navigate_page')"

- description: "[TC-06] Financial sanity transfer impact"
  vars:
    prompt: "Kalau saya transfer 5 juta dari BCA ke Jago, apakah networth saya berkurang?"
  assert:
    - type: contains
      value: "tidak"
    - type: contains
      value: "berkurang"
    - type: llm-rubric
      value: "Agent correctly reasons that inter-wallet transfers do not decrease overall net worth."

- description: "[TC-07] Wallet creation"
  vars:
    prompt: "Tolong buatkan dompet baru di Bank Jago namanya Dompet Belanja saldo awal nol"
  assert:
    - type: contains
      value: "Dompet Belanja"
    - type: javascript
      value: "output.includes('create_wallet')"

- description: "[TC-08] Debt loan query"
  vars:
