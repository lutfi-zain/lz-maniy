# Promptfoo Evaluation Suite for Maniyy Financial Agent
description: "Maniyy Financial Agent Multi-Prompt Matrix & Reasoning Benchmark Across Models"

prompts:
  - id: baseline
    label: "Prompt Baseline (Verbose)"
    raw: "file://prompts/system-baseline.txt"
  - id: compact
    label: "Prompt Compact (Token-Optimized)"
    raw: "file://prompts/system-compact.txt"
  - id: fewshot
    label: "Prompt Few-Shot (Telegram Golden)"
    raw: "file://prompts/system-fewshot.txt"

providers:
  - id: "file://provider.ts"
    label: "Gemini 3.7 Flash (Default)"
    config:
      model: "google-antigravity/gemini-3.7-flash"

  - id: "file://provider.ts"
    label: "Gemini 3.8 Flash (High Tier)"
    config:
      model: "google-antigravity/gemini-3.8-flash"

defaultTest:
  options:
    provider:
      id: "file://grader.ts"

tests: "file://promptfoo-tests.yaml"

evaluateOptions:
  maxConcurrency: 2
  showProgressBar: true
