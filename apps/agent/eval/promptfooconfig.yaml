# Promptfoo Evaluation Suite for Maniy Financial Agent
description: "Maniy Financial Agent Multi-Prompt Matrix & Reasoning Benchmark Across Models"

prompts:
  - id: baseline
    label: "Prompt Baseline (Verbose)"
    raw: "file://prompts/system-baseline.txt"
  - id: compact
    label: "Prompt Compact (Token-Optimized)"
    raw: "file://prompts/system-compact.txt"
  - id: fewshot
    label: "Prompt Few-Shot (Telegram Golden)"
    raw: "file://prompts/system-fewshot.txt"

providers:
  - id: "file://provider.ts"
    label: "Gemini 3.8 Flash (Primary)"
    config:
      model: "google-antigravity/gemini-3.8-flash"

  - id: "file://provider.ts"
    label: "Gemini 3.1 Flash Lite (Fast)"
    config:
      model: "google-antigravity/gemini-3.1-flash-lite"
defaultTest:
  options:
    timeoutMs: 180000
    provider:
      id: "file://grader.ts"
tests: "file://promptfoo-tests.yaml"

evaluateOptions:
  maxConcurrency: 2
  showProgressBar: true
