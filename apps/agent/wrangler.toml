# @walkthrough 01.02:environment-bindings
# @topic Secrets & Typed Bindings
# @ref https://developers.cloudflare.com/workers/configuration/secrets/ | okf://knowledge/vps-infra/concepts/omp-gateway.md
# @notes Mendeklarasikan type-safe environment variables, database D1 bindings, KV namespace, dan interval cron trigger tanpa hardcode secrets.

name = "maniy-agent"
main = "src/index.ts"
compatibility_date = "2024-09-23"

compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "maniyy-agent-db"
database_id = "3a9ed758-9cdb-49af-baa7-e300bbf4b25b"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "CONFIG"
id = "299995e06bcc421caaf932b019078bad"

[[services]]
binding = "REEDRICH"
service = "reedrich-mcp"

[vars]
REEDRICH_API_URL = "https://reedrich-mcp.lutfidmz.workers.dev"
OMP_GATEWAY_URL = "https://ai.membran.app/v1"
LANGFUSE_BASE_URL = "https://us.cloud.langfuse.com"
LANGFUSE_ENABLED = "true"

# Secrets (set via `wrangler secret put`):
# GEMINI_API_KEY
# GROQ_API_KEY
# OMP_GATEWAY_KEY
# LANGFUSE_PUBLIC_KEY
# LANGFUSE_SECRET_KEY
# EVAL_ADMIN_KEY
